server {
    listen 80;
    # In production this is only reachable from CloudFront (port 80 restricted by Security Group)
    # Redirect any direct HTTP to HTTPS if you add a real domain later
    server_name _;

    # ─── Static uploads (served directly by Nginx for performance) ───────────
    location /uploads/ {
        alias /var/www/fit-arc-gym/current/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Prevent directory listing
        autoindex off;
    }

    # ─── Express API reverse proxy ────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;

        # Upgrade headers (for future WebSocket support)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';

        # Pass real client information (CloudFront adds X-Forwarded-For)
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Forward Authorization header for JWT auth
        proxy_set_header   Authorization     $http_authorization;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Disable caching for API responses
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ─── Health check shortcut (optional direct endpoint) ────────────────────
    location = /healthz {
        proxy_pass http://127.0.0.1:5001/api/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    # ─── Block direct access to anything else ────────────────────────────────
    # (CloudFront serves the SPA from S3; the EC2 origin only handles /api/ and /uploads/)
    location / {
        return 404 "This server only handles /api/* and /uploads/*\n";
        add_header Content-Type text/plain;
    }

    # ─── Logging ─────────────────────────────────────────────────────────────
    access_log /var/log/nginx/fit-arc-gym-access.log;
    error_log  /var/log/nginx/fit-arc-gym-error.log;
}
