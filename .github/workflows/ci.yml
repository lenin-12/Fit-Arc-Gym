name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: /api

  
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies (including devDependencies for mongodb-memory-server)
        working-directory: backend
        run: npm ci

      - name: Run pure unit tests (planUtils + pricing business logic — no network needed)
        # Item 5a: pricing.test.js is now included in test:unit
        working-directory: backend
        run: npm run test:unit

      - name: Run API integration tests (HTTP endpoints via child process server)
        working-directory: backend
        run: node --test tests/api.test.js
        env:
          NODE_ENV: test
          DISABLE_AUTO_CONNECT: 'true'
          JWT_SECRET: ci-test-secret-not-used-in-prod
          MONGO_URI: mongodb://localhost:27017/fit-arc-test

      - name: Run wallet logic simulation tests (in-memory mock, no MongoDB needed)
        # Item 5c: renamed comment to clarify this is a logic simulation, not a real DB test
        working-directory: backend
        run: npm run test:wallet

      - name: Run wallet integration tests (real MongoMemoryReplSet + real controller)
        # Item 5b/5c: new real integration tests using mongodb-memory-server replica set
        working-directory: backend
        run: npm run test:wallet:integration
