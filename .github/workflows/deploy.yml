name: Deploy to Production

on:
 
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual trigger'

# Only run if CI succeeded (for workflow_run trigger)
# workflow_dispatch always proceeds (but check-ci gates on main branch below)
permissions:
  contents: read
  id-token: write   # Required for OIDC AWS authentication

# Non-cancelling concurrency: production deploys always complete
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  
  check-ci:
    name: Verify CI Conclusion
    runs-on: ubuntu-latest
    # Item 4c: prevent manual dispatch from deploying an unreviewed branch
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      deploy_sha: ${{ steps.check.outputs.deploy_sha }}
    steps:
      - name: Determine if deploy should proceed
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "deploy_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — proceeding with ${{ github.sha }}"
          elif [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "deploy_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "CI passed on ${{ github.event.workflow_run.head_sha }} — proceeding"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "deploy_sha=" >> "$GITHUB_OUTPUT"
            echo "CI did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }}) — skipping deploy"
          fi

  
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: check-ci
    if: needs.check-ci.outputs.should_deploy == 'true'
    environment: production

    steps:
      - name: Checkout exact SHA that CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-ci.outputs.deploy_sha }}

      - name: Set GIT_SHA output
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package backend (no node_modules, no .env)
        # Archive root IS the backend directory; deploy/ is included as a sub-folder.
        # This means releases/<sha>/package.json (not releases/<sha>/backend/package.json).
        # BEFORE fix: tar ran from repo root with backend/ deploy/ → wrong layout.
        # AFTER fix:  -C backend . puts backend files at root; -C . deploy/ adds scripts.
        run: |
          tar -czf backend-${{ steps.sha.outputs.sha }}.tar.gz \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='uploads' \
            -C "$GITHUB_WORKSPACE/backend" . \
            -C "$GITHUB_WORKSPACE" deploy/

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload release artifact to S3
        run: |
          aws s3 cp backend-${{ steps.sha.outputs.sha }}.tar.gz \
            s3://${{ vars.AWS_S3_ARTIFACTS_BUCKET }}/deploy/releases/backend-${{ steps.sha.outputs.sha }}.tar.gz

      - name: Upload deploy-backend.sh to S3 (always current)
        # Item 3a: upload the script alongside the tarball so the EC2 instance
        # always runs the version from this exact commit — not a stale manual copy.
        # The SSM command downloads and executes it, so shared/deploy-backend.sh is current.
        run: |
          aws s3 cp deploy/deploy-backend.sh \
            s3://${{ vars.AWS_S3_ARTIFACTS_BUCKET }}/deploy/releases/deploy-backend.sh

      - name: Deploy via SSM Run Command
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"aws s3 cp s3://${{ vars.AWS_S3_ARTIFACTS_BUCKET }}/deploy/releases/deploy-backend.sh /var/www/fit-arc-gym/shared/deploy-backend.sh\",
              \"chmod +x /var/www/fit-arc-gym/shared/deploy-backend.sh\",
              \"bash /var/www/fit-arc-gym/shared/deploy-backend.sh ${{ steps.sha.outputs.sha }} ${{ vars.AWS_S3_ARTIFACTS_BUCKET }} deploy/releases\"
            ]" \
            --timeout-seconds 300 \
            --output text \
            --query "Command.CommandId")
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: ${COMMAND_ID}"

      - name: Wait for SSM command to complete
        run: |
          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"
          INSTANCE_ID="${{ vars.AWS_EC2_INSTANCE_ID }}"
          echo "Polling SSM command ${COMMAND_ID}..."
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "  [${i}/60] Status: ${STATUS}"
            if [[ "${STATUS}" == "Success" ]]; then
              echo "SSM command succeeded."
              break
            elif [[ "${STATUS}" == "Failed" || "${STATUS}" == "Cancelled" || "${STATUS}" == "TimedOut" ]]; then
              echo "SSM command ${STATUS}. Fetching output..."
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "StandardErrorContent" \
                --output text || true
              exit 1
            fi
            sleep 5
            if [[ "${i}" == "60" ]]; then
              echo "ERROR: Timed out waiting for SSM command."
              exit 1
            fi
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend Deploy: Build → S3 sync → CloudFront invalidation
  # Item 4a: runs AFTER deploy-backend so a broken backend blocks the UI deploy.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [check-ci, deploy-backend]
    if: needs.check-ci.outputs.should_deploy == 'true'
    environment: production

    steps:
      - name: Checkout exact SHA that CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-ci.outputs.deploy_sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for production
        working-directory: frontend
        run: npm run build
        env:
          # Relative /api path: CloudFront routes /api/* to EC2 origin
          VITE_API_URL: /api

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync hashed assets to S3 (long-lived cache, no --delete yet)
        # Item 4b step 1: Upload new hashed assets WITHOUT --delete and WITHOUT
        # index.html. Old hashed files are still present so clients with a cached
        # index.html can still load their chunks during the transition window.
        run: |
          aws s3 sync frontend/dist/ s3://${{ vars.AWS_S3_FRONTEND_BUCKET }}/ \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload index.html with no-cache
        # Item 4b step 2: Only now atomically swap index.html — after all new
        # hashed assets are already on S3. New visitors get the new app;
        # cached-index visitors still get valid old chunks (not yet deleted).
        run: |
          aws s3 cp frontend/dist/index.html \
            s3://${{ vars.AWS_S3_FRONTEND_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache for index.html only
        # Item 4b step 3: Invalidate only /index.html — the hashed assets are
        # immutable and do not need invalidation.
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html"

      - name: Remove stale hashed assets (safe cleanup)
        # Item 4b step 4: Now that index.html is live and CF is invalidated,
        # delete obsolete hashed chunks. Any client that just received the new
        # index.html is already requesting new hashes. Old cached-index clients
        # have had a chance to reload.
        run: |
          aws s3 sync frontend/dist/ s3://${{ vars.AWS_S3_FRONTEND_BUCKET }}/ \
            --exclude "index.html" \
            --delete

  # ─────────────────────────────────────────────────────────────────────────────
  # Final verification: check the public CloudFront URL returns 200
  # ─────────────────────────────────────────────────────────────────────────────
  verify-production:
    name: Verify Production Health
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    environment: production

    steps:
      - name: Wait for CloudFront propagation
        run: sleep 10

      - name: Check public /api/health endpoint
        run: |
          CF_URL="https://${{ vars.AWS_CLOUDFRONT_DOMAIN }}"
          echo "Verifying: ${CF_URL}/api/health"
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" "${CF_URL}/api/health")
          echo "HTTP response: ${HTTP_CODE}"
          if [[ "${HTTP_CODE}" != "200" ]]; then
            echo "ERROR: Production health check returned HTTP ${HTTP_CODE}"
            echo "  Check: pm2 logs fit-arc-gym"
            echo "  Check: tail -50 /var/log/nginx/fit-arc-gym-error.log"
            exit 1
          fi
          echo "Production health check PASSED — deployment complete."

      - name: Check /api/health/db endpoint (Item 2b — exit 1 on failure)
        # Item 2b: retry up to 5 times and exit 1 if DB is still unreachable.
        # A wrong MONGO_URI must fail the deploy, not silently pass as green.
        run: |
          CF_URL="https://${{ vars.AWS_CLOUDFRONT_DOMAIN }}"
          DB_HEALTH_OK=0
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" "${CF_URL}/api/health/db" || echo "000")
            echo "  DB health attempt ${i}/5: HTTP ${HTTP_CODE}"
            if [[ "${HTTP_CODE}" == "200" ]]; then
              DB_HEALTH_OK=1
              break
            fi
            sleep 5
          done
          if [[ "${DB_HEALTH_OK}" -eq 0 ]]; then
            echo "ERROR: DB health check returned non-200 after 5 attempts."
            echo "  Verify MONGO_URI in /var/www/fit-arc-gym/shared/.env"
            echo "  Verify MongoDB Atlas network access includes the EC2 public IP."
            exit 1
          fi
          echo "DB health check PASSED."
